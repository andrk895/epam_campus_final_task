# Alembic configuration. Run the commands from the repository root, e.g.:
#
#   uv run alembic upgrade head                 # apply all migrations
#   uv run alembic downgrade base               # revert everything
#   uv run alembic revision --autogenerate --rev-id 0002 -m "add something"
#
# The database URL is NOT configured here. env.py takes it from (first match wins):
#   1. `-x dburl=postgresql+psycopg://...` on the command line,
#   2. `sqlalchemy.url` set programmatically on the Config object (used by tests),
#   3. the application's settings: DATABASE_URL from the environment or `.env`.

[alembic]
script_location = %(here)s/src/app/db/migrations

# Migration files are named "<revision>_<slug>.py" (e.g. 0001_initial_schema.py). Pass
# `--rev-id` to `alembic revision` to keep the revision ids sequential.
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 40

# Use UTC for the "Create Date" in new migration files.
timezone = UTC

path_separator = os

# Intentionally empty: see the comment at the top of this file.
sqlalchemy.url =

[post_write_hooks]

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
